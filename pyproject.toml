[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange-equilibrium"
version = "0.1.0"
description = "跨币种交易及价格指数的修订版次概览"
requires-python = ">=3.11,<3.12"

[tool.unittest]
start-directory = "tests"

[tool.setuptools.packages.find]
include = ["exchange_equilibrium*"]
exclude = ["tests*", "tools*", "fixtures*"]
